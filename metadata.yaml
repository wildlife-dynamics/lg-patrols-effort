name: LG Patrols Effort
author:
  - name: Tevin Temu
    organization: Wildlife Dynamics
    email: tevin@wildlifedynamics.com

description: Generates a patrol effort report for Lion Guardians rangers in the Amboseli ecosystem from EarthRanger patrol tracks and events, producing patrol event, trajectory, and coverage maps, event charts, and per-guardian, event type, and monthly summary tables, on an interactive dashboard and in a Word report.
theory: "Patrol GPS fixes are restricted to daytime hours (06:00 to 19:00 local time) and converted to trajectory segments, with segments of unrealistic length, duration, or speed (above 7 km/h by default) dropped to remove GPS noise. Patrol coverage is mapped with Linear Time Density, which distributes the time spent along each segment across a grid. Patrol events are filtered to the Amboseli extent by default, and effort is summarised as patrol counts, distance, and time per guardian, event counts by type, and monthly totals."
output_comment: "Outputs a dashboard with patrol events, patrol trajectories, and linear time density maps over EarthRanger conservancy and group ranch boundaries, plus a time series bar chart and event type pie chart. Also writes patrol events and trajectories (GeoParquet), HTML and PNG copies of each group's maps and charts, per-guardian, guardian by event type, event type, and monthly patrol effort CSV tables, and a Word report (overall_report.docx) with a cover page and one section per group."
